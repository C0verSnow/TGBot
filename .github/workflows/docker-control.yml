name: Docker control
run-name: Docker ${{ inputs.action }} / Telegram ${{ inputs.update_id }}
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [start, stop]
        required: true
      user_id:
        type: string
        required: true
      chat_id:
        type: string
        required: true
      update_id:
        type: string
        required: true
permissions:
  contents: read
jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: bot-control
    env:
      INPUT_ACTION: ${{ inputs.action }}
      INPUT_USER_ID: ${{ inputs.user_id }}
      INPUT_CHAT_ID: ${{ inputs.chat_id }}
      INPUT_UPDATE_ID: ${{ inputs.update_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Check inputs and whitelist before joining tailnet
        run: python -c 'from scripts.worker import inputs; inputs()'
      - uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:tgbot-ci
      - name: Execute and report
        run: python scripts/worker.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      - name: Report workflow failure
        if: failure()
        run: python scripts/worker.py --notify-failure
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
