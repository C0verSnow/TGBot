name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: false
      - name: Resolve pinned dependencies
        run: go mod tidy
      - name: Save dependency metadata for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: go-dependencies
          path: |
            go.mod
            go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l api/*.go internal/bot/*.go internal/allowlist/*.go)"
      - name: Test security boundaries and races
        run: go test -race -timeout 3m ./...
      - name: Static analysis
        run: go vet ./...
      - name: Build Linux functions
        run: go build ./...
      - name: Build with a generated root entrypoint like Vercel
        run: |
          trap 'rm -f main__vc__go__.go' EXIT
          cat > main__vc__go__.go <<'GO'
          package main
          import _ "github.com/C0verSnow/TGBot/api"
          func main() {}
          GO
          go build -o "$RUNNER_TEMP/tgbot-vercel-wrapper" main__vc__go__.go
