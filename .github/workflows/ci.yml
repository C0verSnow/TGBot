name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  secret-state:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y redis-tools
      - name: Verify real Redis transactions and concurrent claims
        env:
          TGBOT_REDIS_TEST: '1'
        run: python -m unittest discover -s tests -p test_secret_state.py -v
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: false
      - name: Record actual toolchain
        run: |
          mkdir -p security-results
          go version | tee security-results/go-version.txt
          go env GOOS GOARCH GOTOOLCHAIN | tee security-results/go-environment.txt
          test "$(go env GOVERSION)" = "go$(awk '/^go / {print $2}' go.mod)"
      - name: Resolve pinned dependencies
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verify downloaded modules
        run: go mod verify | tee security-results/mod-verify.txt
      - name: Save dependency metadata for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: go-dependencies
          path: |
            go.mod
            go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l api/*.go pkg/bot/*.go pkg/allowlist/*.go)"
      - name: Test security boundaries and races
        run: go test -race -v -timeout 3m ./... | tee security-results/go-test.txt
      - name: Static analysis
        run: go vet ./... 2>&1 | tee security-results/go-vet.txt
      - name: Build Linux functions
        run: go build ./...
      - name: Build with a generated root entrypoint like Vercel
        run: |
          cp go.mod "$RUNNER_TEMP/tgbot-go.mod"
          trap 'rm -f main__vc__go__.go; cp "$RUNNER_TEMP/tgbot-go.mod" go.mod' EXIT
          go mod edit -module handler
          go mod edit -require github.com/C0verSnow/TGBot@v0.0.0
          go mod edit -replace github.com/C0verSnow/TGBot=.
          cat > main__vc__go__.go <<'GO'
          package main
          import _ "handler/api"
          func main() {}
          GO
          go build -o "$RUNNER_TEMP/tgbot-vercel-wrapper" main__vc__go__.go

      - name: Scan module versions and reachable calls
        if: ${{ !cancelled() }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go version -m "$(go env GOPATH)/bin/govulncheck" > security-results/scanner-version.txt
          # Module mode defaults to the current package; this repo has no root .go files.
          (cd pkg/bot && govulncheck -mode=source -scan=module -json) > security-results/vuln-modules.json
          govulncheck -mode=source -json ./... > security-results/vuln-source.json
          govulncheck ./... 2>&1 | tee security-results/vuln-summary.txt
      - name: Preserve security evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: go-security-results
          path: security-results/
          retention-days: 30
