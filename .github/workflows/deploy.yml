name: Deploy Vercel and set webhook
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      GOTOOLCHAIN: local
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
      - name: Verify actual release toolchain and modules
        run: |
          go version
          test "$(go env GOVERSION)" = "go$(awk '/^go / {print $2}' go.mod)"
          go mod verify
      - name: Test before release
        run: |
          go test -race -timeout 3m ./...
          pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Install reviewed CLI version
        env:
          VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION }}
        run: |
          [[ "$VERCEL_CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm install -g "vercel@$VERCEL_CLI_VERSION"
      - name: Deploy on Vercel remote builders
        run: vercel deploy --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Register Telegram webhook
        run: python scripts/set_webhook.py
        env:
          WEBHOOK_URL: ${{ vars.WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
  preview:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      GOTOOLCHAIN: local
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
      - name: Verify actual release toolchain and modules
        run: |
          go version
          test "$(go env GOVERSION)" = "go$(awk '/^go / {print $2}' go.mod)"
          go mod verify
      - name: Check Go before preview
        run: go test -race -timeout 3m ./...
      - name: Install reviewed CLI
        env:
          VERCEL_CLI_VERSION: ${{ vars.VERCEL_CLI_VERSION }}
        run: |
          [[ "$VERCEL_CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm install -g "vercel@$VERCEL_CLI_VERSION"
      - name: Deploy preview on Vercel remote builders
        run: vercel deploy --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Preview never calls setWebhook or executes a real Docker command.
